services:
  db:
    image: postgres:16-alpine
    container_name: history_timeline_db
    environment:
      POSTGRES_USER: historian
      POSTGRES_PASSWORD: historian
      POSTGRES_DB: history_timeline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U historian -d history_timeline"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
