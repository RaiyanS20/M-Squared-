# Continuous integration for the history-timeline project.
#
# The job of CI is to answer one question on every push: "would this break if we
# shipped it?" Everything below serves answering that FAST and with no false
# positives — a pipeline people trust is a pipeline people read.
name: history-timeline CI

on:
  push:
    branches: ['**']
    paths: ['history-timeline/**', '.github/workflows/history-timeline-ci.yml']
  pull_request:
    paths: ['history-timeline/**', '.github/workflows/history-timeline-ci.yml']

# A new push to the same branch cancels the previous run. No point spending
# minutes verifying a commit that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: history-timeline

jobs:
  verify:
    name: Test
    runs-on: ubuntu-latest

    # A real PostgreSQL for the opt-in repository contract tests. This is what
    # makes "it passed in CI" mean something about production.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: historian
          POSTGRES_PASSWORD: historian
          POSTGRES_DB: history_timeline
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U historian -d history_timeline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://historian:historian@localhost:5432/history_timeline
      # Setting this is what un-skips the Postgres half of the contract tests.
      TEST_DATABASE_URL: postgres://historian:historian@localhost:5432/history_timeline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: history-timeline/package-lock.json

      # `npm ci`, never `npm install`: it installs exactly the lockfile, so CI
      # tests the dependency tree you committed rather than whatever published
      # five minutes ago.
      - name: Install dependencies
        run: npm ci

      - name: Migrate and seed the test database
        run: |
          npm run db:migrate
          npm run db:seed

      # Runs the full suite INCLUDING the Postgres contract tests.
      - name: Test
        run: npm test

      # There is no build step for this project, so instead we prove the server
      # actually starts and serves both the API and the page. A green test suite
      # that cannot boot helps nobody.
      - name: Smoke test the running server
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/ready > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4000/ready | grep -q '"database":"up"'
          curl -sf http://localhost:4000/ | grep -q '<title>'
          curl -sf http://localhost:4000/js/app.js > /dev/null
          curl -sf http://localhost:4000/api/years/1994/countries/ZAF/events | grep -q 'election'
          echo "server serves the API and the page"
